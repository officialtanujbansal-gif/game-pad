name: Build OmniSync Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "server.ts"
      - "electron/**"
      - "public/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: omnisync-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Cache Electron desktop runtime
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.electron-cache
          key: windows-electron-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline --no-progress --fetch-retries=2 --fetch-timeout=180000

      - name: Type-check the renderer and Electron API
        run: npm run lint

      - name: Check Electron entry-point syntax
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check scripts/start-build-server.cjs

      - name: Build React renderer and bundled Node server
        run: npm run build:desktop

      - name: Smoke-test bundled server
        run: npm run test:desktop-server

      - name: Prepare and smoke-test bundled Windows receiver scripts
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows-receiver.ps1

      - name: Package NSIS installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: OmniSync-Bridge-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
