name: Build OmniSync Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "server.ts"
      - "electron/**"
      - "public/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: omnisync-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check the renderer and Electron API
        run: npm run lint

      - name: Check Electron entry-point syntax
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check scripts/start-build-server.cjs

      - name: Build React renderer and bundled Node server
        run: npm run build:desktop

      - name: Smoke-test bundled server
        run: npm run test:desktop-server

      - name: Set up Python for the self-contained Windows receiver
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-receiver-build.txt

      - name: Install receiver build dependencies
        timeout-minutes: 10
        shell: pwsh
        run: |
          $env:PIP_DISABLE_PIP_VERSION_CHECK = "1"
          $env:PIP_NO_INPUT = "1"
          $env:PIP_DEFAULT_TIMEOUT = "20"
          python -m pip install --no-input --disable-pip-version-check --retries 2 --timeout 20 --prefer-binary -r scripts/requirements-receiver-build.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Receiver dependency installation failed with exit code $LASTEXITCODE."
          }
          python -m PyInstaller --version
          python -c "import vgamepad, websockets; print('Receiver imports OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "Receiver package import check failed with exit code $LASTEXITCODE."
          }

      - name: Build and smoke-test bundled Windows receiver
        shell: pwsh
        run: ./scripts/build-windows-receiver.ps1

      - name: Package NSIS installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: OmniSync-Bridge-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
